name: CS142 Project3 DOM
on:
  push:
    branches: [edidada/project3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original dependencies and original lint
        run: |
          npm ci --prefix project3
          npm run lint --prefix project3 -- --max-warnings 0
      - name: Install browser verification dependency separately
        run: |
          npm install --prefix .browser-check --no-package-lock playwright@1.56.1
          .browser-check/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual Chromium DOM and interaction checks
        env:
          NODE_PATH: ${{ github.workspace }}/.browser-check/node_modules
        run: node scripts/verify-project3.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cs142-project3-browser-results
          path: results/
